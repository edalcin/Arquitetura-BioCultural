<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C8377"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FAF6EF"/>

  <!-- Título -->
  <text x="600" y="50" text-anchor="middle" font-size="31" font-weight="bold" fill="#37312A">Repartição de benefícios rastreável</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#7A7065">Sem rastro de uso, não há repartição — só promessa</text>

  <!-- ================= COLUNA 1 — ORIGEM ================= -->
  <g>
    <rect x="40" y="120" width="350" height="300" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M40 134 a14 14 0 0 1 14 -14 h322 a14 14 0 0 1 14 14 v22 h-350 z" fill="#2E6B4F"/>
    <text x="215" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">ORIGEM</text>
    <text x="215" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#37312A">Registro com proveniência</text>
    <text x="215" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#37312A">completa</text>

    <rect x="70" y="230" width="290" height="30" rx="15" fill="#E4EFE7"/>
    <text x="215" y="250" text-anchor="middle" font-size="11.5" fill="#2E6B4F">member_id</text>

    <rect x="70" y="272" width="290" height="30" rx="15" fill="#E4EFE7"/>
    <text x="215" y="292" text-anchor="middle" font-size="11.5" fill="#2E6B4F">comunidade de origem</text>

    <rect x="70" y="314" width="290" height="30" rx="15" fill="#E4EFE7"/>
    <text x="215" y="334" text-anchor="middle" font-size="11.5" fill="#2E6B4F">DOI do conjunto</text>

    <text x="215" y="380" text-anchor="middle" font-size="11" fill="#7A7065">sem origem rastreável, não há</text>
    <text x="215" y="398" text-anchor="middle" font-size="11" fill="#7A7065">a quem repartir</text>
  </g>

  <path d="M394 270 H 421" fill="none" stroke="#8C8377" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <!-- ================= COLUNA 2 — USO ================= -->
  <g>
    <rect x="425" y="120" width="350" height="300" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M425 134 a14 14 0 0 1 14 -14 h322 a14 14 0 0 1 14 14 v22 h-350 z" fill="#3D5A80"/>
    <text x="600" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">USO</text>
    <text x="600" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#37312A">Todo acesso deixa rastro</text>
    <text x="600" y="208" text-anchor="middle" font-size="11" fill="#B4542F">[a implementar no Pluriverso]</text>

    <rect x="455" y="230" width="290" height="30" rx="15" fill="#E7EDF5"/>
    <text x="600" y="250" text-anchor="middle" font-size="11.5" fill="#3D5A80">log de consulta e download</text>

    <rect x="455" y="272" width="290" height="30" rx="15" fill="#E7EDF5"/>
    <text x="600" y="292" text-anchor="middle" font-size="11.5" fill="#3D5A80">citação com DOI</text>

    <rect x="455" y="314" width="290" height="30" rx="15" fill="#E7EDF5"/>
    <text x="600" y="334" text-anchor="middle" font-size="11.5" fill="#3D5A80">finalidade declarada</text>

    <text x="600" y="380" text-anchor="middle" font-size="11" fill="#7A7065">a plataforma prova o uso que</text>
    <text x="600" y="398" text-anchor="middle" font-size="11" fill="#7A7065">passa por ela — e só esse</text>
  </g>

  <path d="M779 270 H 806" fill="none" stroke="#8C8377" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <!-- ================= COLUNA 3 — RETORNO ================= -->
  <g>
    <rect x="810" y="120" width="350" height="300" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M810 134 a14 14 0 0 1 14 -14 h322 a14 14 0 0 1 14 14 v22 h-350 z" fill="#B4542F"/>
    <text x="985" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">RETORNO</text>
    <text x="985" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#37312A">Benefício volta em duas formas</text>

    <rect x="840" y="206" width="290" height="76" rx="14" fill="#FBEBE2"/>
    <text x="985" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#B4542F">monetária</text>
    <text x="985" y="250" text-anchor="middle" font-size="11" fill="#B4542F">Lei 13.123/2015 · FNRB</text>
    <text x="985" y="268" text-anchor="middle" font-size="11" fill="#B4542F">acordo de repartição</text>

    <rect x="840" y="294" width="290" height="94" rx="14" fill="#FBEBE2"/>
    <text x="985" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#B4542F">não monetária</text>
    <text x="985" y="338" text-anchor="middle" font-size="11" fill="#B4542F">coautoria · capacitação</text>
    <text x="985" y="356" text-anchor="middle" font-size="11" fill="#B4542F">infraestrutura</text>
    <text x="985" y="374" text-anchor="middle" font-size="11" fill="#B4542F">devolução dos dados</text>
  </g>

  <!-- ================= FAIXA INFERIOR ================= -->
  <g>
    <rect x="40" y="460" width="1120" height="170" rx="18" fill="#2E6B4F"/>
    <text x="600" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">O que não se mede não se reparte</text>
    <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#CFE3D6">o log de uso é instrumento de justiça, não de vigilância</text>
    <g font-size="12.5" fill="#FFFFFF">
      <rect x="110" y="566" width="300" height="32" rx="16" fill="#3D7C5E"/>
      <text x="260" y="587" text-anchor="middle">SisGen</text>
      <rect x="450" y="566" width="300" height="32" rx="16" fill="#3D7C5E"/>
      <text x="600" y="587" text-anchor="middle">acordo registrado como dado</text>
      <rect x="790" y="566" width="300" height="32" rx="16" fill="#3D7C5E"/>
      <text x="940" y="587" text-anchor="middle">prestação de contas anual</text>
    </g>
  </g>

  <!-- Rodapé -->
  <text x="600" y="692" text-anchor="middle" font-size="12" fill="#7A7065">a plataforma produz a evidência — quem reparte é quem usa</text>
</svg>
