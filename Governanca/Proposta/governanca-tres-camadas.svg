<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C8377"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B4F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#FAF6EF"/>

  <!-- Título -->
  <text x="600" y="50" text-anchor="middle" font-size="31" font-weight="bold" fill="#37312A">Três camadas de governança</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#7A7065">Quem decide o quê, e até onde vai cada decisão</text>

  <!-- ================= CAMADA ARQUITETURA (topo) ================= -->
  <g>
    <rect x="290" y="106" width="620" height="150" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M290 120 a14 14 0 0 1 14 -14 h592 a14 14 0 0 1 14 14 v22 h-620 z" fill="#3D5A80"/>
    <text x="600" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">GOVERNANÇA DA ARQUITETURA</text>
    <text x="600" y="168" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#37312A">O Comitê Federado decide</text>
    <text x="600" y="192" text-anchor="middle" font-size="11.5" fill="#7A7065">ADRs · contrato de harvest · admissão de membros</text>
    <rect x="445" y="204" width="310" height="26" rx="13" fill="#E7EDF5"/>
    <text x="600" y="221" text-anchor="middle" font-size="11.5" fill="#3D5A80">consenso ou maioria qualificada</text>
  </g>

  <path d="M600 256 V 282" fill="none" stroke="#8C8377" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="925" y="273" font-size="11" fill="#8C8377">habilita, não decide por</text>

  <!-- ================= CAMADA FERRAMENTAS (meio) ================= -->
  <g>
    <rect x="290" y="282" width="620" height="150" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M290 296 a14 14 0 0 1 14 -14 h592 a14 14 0 0 1 14 14 v22 h-620 z" fill="#B4542F"/>
    <text x="600" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">GOVERNANÇA DAS FERRAMENTAS</text>
    <text x="600" y="344" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#37312A">O mantenedor da instância decide</text>
    <text x="600" y="368" text-anchor="middle" font-size="11.5" fill="#7A7065">deploy · versão · backup · segurança</text>
    <rect x="445" y="380" width="310" height="26" rx="13" fill="#FBEBE2"/>
    <text x="600" y="397" text-anchor="middle" font-size="11.5" fill="#B4542F">1 container · 1 SQLite soberano</text>
  </g>

  <path d="M600 432 V 458" fill="none" stroke="#8C8377" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="925" y="449" font-size="11" fill="#8C8377">habilita, não decide por</text>

  <!-- ================= CAMADA DADOS (base) ================= -->
  <g>
    <rect x="290" y="458" width="620" height="150" rx="14" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.5"/>
    <path d="M290 472 a14 14 0 0 1 14 -14 h592 a14 14 0 0 1 14 14 v22 h-620 z" fill="#2E6B4F"/>
    <text x="600" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.6">GOVERNANÇA DOS DADOS</text>
    <text x="600" y="520" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#37312A">A comunidade decide</text>
    <text x="600" y="544" text-anchor="middle" font-size="11.5" fill="#7A7065">o que se registra · o que se publica · o que se retira</text>
    <rect x="445" y="556" width="310" height="26" rx="13" fill="#E4EFE7"/>
    <text x="600" y="573" text-anchor="middle" font-size="11.5" fill="#2E6B4F">CLPI · rotulagem · revogação</text>
    <text x="600" y="598" text-anchor="middle" font-size="11" fill="#B4542F">nenhuma decisão técnica sobrepõe esta</text>
  </g>

  <!-- Rodapé de princípios -->
  <g>
    <rect x="40" y="626" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.3"/>
    <text x="62" y="652" font-size="13" font-weight="bold" fill="#2E6B4F">Soberania</text>
    <text x="62" y="673" font-size="12" fill="#7A7065">o dado mora com quem o gerou</text>

    <rect x="420" y="626" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.3"/>
    <text x="442" y="652" font-size="13" font-weight="bold" fill="#B4542F">Consentimento</text>
    <text x="442" y="673" font-size="12" fill="#7A7065">sem CLPI, o registro não entra</text>

    <rect x="800" y="626" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D9CBB4" stroke-width="1.3"/>
    <text x="822" y="652" font-size="13" font-weight="bold" fill="#3D5A80">Reversibilidade</text>
    <text x="822" y="673" font-size="12" fill="#7A7065">toda decisão pode ser desfeita</text>
  </g>
</svg>
